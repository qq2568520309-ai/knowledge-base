name: 构建并部署知识库

on:
  push:
    branches: [main]
  workflow_dispatch:        # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                # 同时只跑一个部署，避免并发覆盖
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 若启用 git-revision-date 插件，需要完整历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 构建站点
        run: mkdocs build --strict   # --strict: 有死链/警告就让构建失败

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # 若仓库还没启用 Pages，自动帮你开启（无需手动点设置）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
